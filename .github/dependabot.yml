version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Picks up new releases of the Quiet patches, whose extension code is compiled into the module.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    allow:
      - dependency-name: "quiet-patches"
    schedule:
      interval: "daily"
